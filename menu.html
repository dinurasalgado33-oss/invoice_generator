<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu — Leopard Inn</title>
<meta name="description" content="Menus for Leopard Inn Wilpattu and Leopard Inn Arugam Bay." />
<meta name="theme-color" content="#F8F0DA" />

<!--
  One address for every menu, at both properties.
  https://leopard-inn.web.app/menu.html

  A guest lands here from a QR code on a table, taps their menu, and gets
  the PDF the staff portal built — same artwork, same prices, one file.
  This page's whole job is to disappear in one tap.

  The look is taken from the menus themselves rather than invented beside
  them: the same cream ground (#F8F0DA), the same gold rule, the same
  fronds bleeding in from the top corners and dunes along the bottom, and
  each property in its own colour — teal for the sea at Arugam Bay,
  forest green for Wilpattu. Those values are lifted from PALETTES in
  js/menu-pdf.js, so the page and the documents it links to agree.

  Deliberately one visual world, not theme-aware. The menus are cream
  paper; a dark version of this page would be a different object.
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Straight from PALETTES in js/menu-pdf.js. */
    --ground: #F8F0DA;
    --gold: #C2A03C;
    --ink: #2A2A24;
    --muted: #8A8676;

    /* Arugam Bay — the sea. */
    --ab-heading: #27505E;
    --ab-accent: #4D8496;

    /* Wilpattu — the forest. */
    --wp-heading: #2D4A2A;
    --wp-accent: #5C7C4E;

    --measure: 34rem;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-size: 1.0625rem;
    line-height: 1.55;
    /* The art bleeds off every edge; nothing should scroll sideways. */
    overflow-x: hidden;
    position: relative;
  }

  /* ---- the frame, echoing the menus' cover ---------------------------
     Fixed rather than scrolled, so on a long list the fronds stay where
     they were placed instead of drifting up out of the composition.
     Pointer-events off: this is paper, not furniture. */
  .art {
    position: fixed;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }
  .art img { display: block; width: 100%; height: auto; }

  .art-left  { top: -1.5rem; left: -3rem;  width: min(46vw, 17rem); transform-origin: top left; z-index: 1; }
  .art-right { top: -2.5rem; right: -3rem; width: min(38vw, 14rem); transform-origin: top right; z-index: 1; }
  .art-dunes { bottom: -1px; left: 0; right: 0; width: 100%; opacity: .85; }

  /* ---- wind ----------------------------------------------------------
     Two layers per frond, on purpose. The wrapper swings the whole branch
     from where it meets the edge; the image inside skews and stretches a
     little on its own, slower and out of step. A single rotation reads as
     a pendulum — it is the two periods drifting against each other that
     make it look like air rather than machinery.

     The loops are full circuits rather than `alternate`, so the motion
     never retraces its own path and never pauses at a turning point, and
     the stop percentages are uneven so no beat lands twice.

     Transform only, so this stays on the compositor and costs a phone
     nothing. */
  @keyframes swing-left {
    0%   { transform: rotate(-5.5deg) translate(0, 0); }
    17%  { transform: rotate(2.6deg)  translate(6px, -7px); }
    33%  { transform: rotate(-1.4deg) translate(-3px, 3px); }
    54%  { transform: rotate(7.2deg)  translate(9px, -11px); }
    71%  { transform: rotate(0.8deg)  translate(2px, -2px); }
    86%  { transform: rotate(4.1deg)  translate(5px, -5px); }
    100% { transform: rotate(-5.5deg) translate(0, 0); }
  }
  @keyframes swing-right {
    0%   { transform: rotate(5.0deg)  translate(0, 0); }
    21%  { transform: rotate(-3.2deg) translate(-7px, -5px); }
    39%  { transform: rotate(1.8deg)  translate(3px, 4px); }
    61%  { transform: rotate(-7.6deg) translate(-11px, -9px); }
    78%  { transform: rotate(-0.6deg) translate(-2px, -1px); }
    91%  { transform: rotate(-4.4deg) translate(-6px, -4px); }
    100% { transform: rotate(5.0deg)  translate(0, 0); }
  }

  /* The leaf itself flexing — a skew and a breath of stretch, which is
     what a frond does when the branch it is on moves. */
  @keyframes flex-leaf {
    0%   { transform: skewY(0deg)    scale(1, 1); }
    31%  { transform: skewY(1.8deg)  scale(1.03, 0.985); }
    59%  { transform: skewY(-1.3deg) scale(0.982, 1.022); }
    100% { transform: skewY(0deg)    scale(1, 1); }
  }

  /* ---- sunlight through the leaves -----------------------------------
     The thing that actually makes the page feel alive, more than the
     movement does: a soft warm patch drifting across the paper, the way
     light does under palms when the branches move.

     A radial gradient rather than a blurred element — same softness, no
     filter, no re-rasterising on a phone. Multiply so it warms the cream
     rather than washing over it. */
  .light {
    position: fixed;
    inset: -25vh -25vw;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: multiply;
    background:
      radial-gradient(38vmax 30vmax at 22% 18%, rgba(255, 246, 214, 0) 0%, rgba(206, 178, 108, .20) 55%, rgba(206, 178, 108, 0) 72%),
      radial-gradient(30vmax 26vmax at 78% 30%, rgba(255, 246, 214, 0) 0%, rgba(176, 158, 106, .15) 58%, rgba(176, 158, 106, 0) 75%);
    animation: dapple 29s ease-in-out infinite;
  }
  @keyframes dapple {
    0%   { transform: translate(0, 0)          scale(1); opacity: .85; }
    27%  { transform: translate(3vw, 2vh)      scale(1.08); opacity: 1; }
    53%  { transform: translate(-2vw, 4vh)     scale(1.02); opacity: .78; }
    76%  { transform: translate(2.5vw, -1.5vh) scale(1.11); opacity: .95; }
    100% { transform: translate(0, 0)          scale(1); opacity: .85; }
  }

  /* ---- the shadow the fronds cast on the paper ------------------------
     Sells the fronds as objects above the page rather than pictures
     printed on it. The blur sits on the image, which rasterises once; the
     animation is on the wrapper, which stays composited. It lags the leaf
     slightly, because a shadow on paper does. */
  .art-shadow { z-index: 0; opacity: .085; }
  .art-shadow img { filter: brightness(0) blur(5px); }
  .shadow-left  { top: .5rem; left: -2.4rem;  width: min(46vw, 17rem); transform-origin: top left; }
  .shadow-right { top: -.6rem; right: -2.4rem; width: min(38vw, 14rem); transform-origin: top right; }
  .shadow-left  { animation: swing-left  13s cubic-bezier(.45,.05,.55,.95) infinite -.45s; }
  .shadow-right { animation: swing-right 17s cubic-bezier(.45,.05,.55,.95) infinite -.55s; }

  /* ---- arrival --------------------------------------------------------
     The page settles rather than appearing. Once, on load, and never
     again — a thing that animates every time you look at it is a thing
     you stop looking at. */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .crest, h1, .tagline, .rule { animation: rise .9s cubic-bezier(.2,.7,.3,1) both; }
  h1        { animation-delay: .08s; }
  .tagline  { animation-delay: .16s; }
  .rule     { animation-delay: .24s; }
  .property { animation: rise .9s cubic-bezier(.2,.7,.3,1) both; }
  .property:nth-of-type(1) { animation-delay: .34s; }
  .property:nth-of-type(2) { animation-delay: .46s; }

  /* The dune, drifting. Barely there — it is the sea a long way off, not
     a wave breaking. */
  @keyframes drift {
    0%   { transform: translateX(0)     scaleY(1); }
    50%  { transform: translateX(-14px) scaleY(1.035); }
    100% { transform: translateX(0)     scaleY(1); }
  }

  .art-left  { animation: swing-left  13s cubic-bezier(.45,.05,.55,.95) infinite; }
  .art-right { animation: swing-right 17s cubic-bezier(.45,.05,.55,.95) infinite; }

  .art-left img  { animation: flex-leaf 9s  ease-in-out infinite; transform-origin: top left; }
  .art-right img { animation: flex-leaf 11s ease-in-out infinite -3s; transform-origin: top right; }

  .art-dunes { animation: drift 24s ease-in-out infinite; transform-origin: bottom center; }

  /* Motion is decoration here — the page works identically without it. */
  @media (prefers-reduced-motion: reduce) {
    .art-left, .art-right, .art-left img, .art-right img, .art-dunes,
    .art-shadow, .light, .crest, h1, .tagline, .rule, .property { animation: none; }
  }

  /* ---- the page ---------------------------------------------------- */
  main {
    position: relative;
    z-index: 1;
    max-width: var(--measure);
    margin: 0 auto;
    padding: clamp(3.5rem, 14vw, 7rem) 1.5rem clamp(7rem, 22vw, 10rem);
  }

  .crest { display: block; width: 4.5rem; height: auto; margin: 0 auto 1.5rem; }

  h1 {
    margin: 0;
    text-align: center;
    font-family: Cinzel, Georgia, serif;
    font-weight: 400;
    font-size: clamp(1.6rem, 7vw, 2.3rem);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .tagline {
    margin: .6rem 0 0;
    text-align: center;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--muted);
  }

  /* The gold hairline the menus use under their headings. */
  .rule {
    width: 4.5rem;
    height: 1px;
    margin: 2rem auto 0;
    background: var(--gold);
    border: 0;
  }

  .status {
    margin: 3rem 0;
    text-align: center;
    font-style: italic;
    color: var(--muted);
  }

  /* ---- one property ------------------------------------------------ */
  .property { margin-top: clamp(2.75rem, 9vw, 4rem); }

  .property h2 {
    margin: 0 0 1.25rem;
    text-align: center;
    font-family: Cinzel, Georgia, serif;
    font-weight: 500;
    font-size: clamp(.95rem, 3.6vw, 1.1rem);
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--heading, var(--ink));
  }

  .property[data-branch="Arugam Bay"] { --heading: var(--ab-heading); --accent: var(--ab-accent); }
  .property[data-branch="Wilpattu"]   { --heading: var(--wp-heading); --accent: var(--wp-accent); }

  .menus { list-style: none; margin: 0; padding: 0; }

  .menus li + li { border-top: 1px solid rgba(194, 160, 60, .3); }

  /* The whole row is the target, not the words. A guest is standing up,
     one-handed, holding a phone in low light. */
  .menus a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 3.75rem;
    padding: 1rem .25rem;
    color: var(--heading, var(--ink));
    text-decoration: none;
    font-size: 1.15rem;
    transition: color .18s ease, padding-left .18s ease;
  }
  .menus a:hover,
  .menus a:focus-visible { color: var(--accent); padding-left: .6rem; }
  .menus a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 2px; }
  .menus a:active { opacity: .65; }

  .arrow { flex: none; color: var(--gold); font-size: 1.1rem; line-height: 1; }

  footer {
    margin-top: clamp(3rem, 10vw, 4.5rem);
    text-align: center;
    font-size: .9rem;
    color: var(--muted);
    /* Clear of the dune. The wave is fixed to the bottom of the viewport,
       so without this the last line of text sits inside it and is read
       through the paint — the menus themselves keep the same clearance,
       which is what FOOT = A4.h - 42 is doing in menu-pdf.js. */
    padding-bottom: 4.5rem;
  }
</style>
</head>
<body>

<div class="light"></div>

<div class="art art-shadow shadow-left"><img src="assets/menu/wp-frond-1.png" alt="" /></div>
<div class="art art-shadow shadow-right"><img src="assets/menu/ab-frond-1.png" alt="" /></div>

<div class="art art-left"><img src="assets/menu/wp-frond-1.png" alt="" /></div>
<div class="art art-right"><img src="assets/menu/ab-frond-1.png" alt="" /></div>
<div class="art art-dunes"><img src="assets/menu/ab-wave-b.png" alt="" /></div>

<main>
  <img class="crest" src="assets/menu/crest.png" alt="" />
  <h1>Leopard Inn</h1>
  <p class="tagline">Our menus</p>
  <hr class="rule" />

  <p class="status" id="status">Loading…</p>
  <div id="menus"></div>

  <footer id="footer" hidden>All prices are in Sri Lankan Rupees.</footer>
</main>

<script type="module">
import { firebaseConfig } from "./js/data/firebase-config.js";

// The same SDK version the portal boots with — a different URL is a
// different copy of the SDK, with its own service registry.
const SDK = "https://www.gstatic.com/firebasejs/11.0.2";

// The list comes from Firestore, not from Storage.
//
// Storage was the obvious place, beside the PDFs it describes. It does
// not work: a browser cannot `fetch` a Storage object from another origin
// unless CORS is configured on the bucket, and the failure is a bare
// "Failed to fetch" that says nothing about why. A Firestore read has no
// such trouble, and the PDFs are unaffected because they are opened by
// ordinary link navigation, which CORS does not apply to.
async function readIndex() {
  const [{ initializeApp }, fs] = await Promise.all([
    import(`${SDK}/firebase-app.js`),
    import(`${SDK}/firebase-firestore.js`),
  ]);
  const db = fs.getFirestore(initializeApp(firebaseConfig()));
  const snap = await fs.getDoc(fs.doc(db, "publicMenus", "index"));
  return snap.exists() ? snap.data() : { menus: [] };
}

function escapeHtml(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Grouped by property, because a guest at one hotel should not have to
// read past the other hotel's menus to find theirs.
function render(menus) {
  const byBranch = new Map();
  menus.forEach(m => {
    const key = m.branch || m.branchLabel;
    if (!byBranch.has(key)) byBranch.set(key, { label: m.branchLabel || m.branch, items: [] });
    byBranch.get(key).items.push(m);
  });

  return [...byBranch.entries()].map(([branch, group]) => `
    <section class="property" data-branch="${escapeHtml(branch)}">
      <h2>${escapeHtml(group.label)}</h2>
      <ul class="menus">
        ${group.items.map(m => `
          <li>
            <a href="${escapeHtml(m.url)}">
              <span>${escapeHtml(m.title)}</span>
              <span class="arrow" aria-hidden="true">&rarr;</span>
            </a>
          </li>`).join("")}
      </ul>
    </section>`).join("");
}

readIndex()
  .then(data => {
    const menus = (data.menus || []).filter(m => m && m.url && m.title);
    const status = document.getElementById("status");
    if (!menus.length) {
      status.textContent = "No menus have been published yet.";
      return;
    }
    status.hidden = true;
    document.getElementById("menus").innerHTML = render(menus);
    document.getElementById("footer").hidden = false;
  })
  .catch(err => {
    // A guest cannot fix this and should not be shown a stack trace. Give
    // them the thing that always works — the phone in reception.
    document.getElementById("status").textContent =
      "Sorry — the menu could not be loaded. Please ask reception.";
    console.error("Menu index failed:", err);
  });
</script>

</body>
</html>
