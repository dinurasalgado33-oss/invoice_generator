<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu — Leopard Inn</title>
<!--
  One address for every menu, at both properties.
  https://leopard-inn.web.app/menu.html

  This page is a list, not a menu. Each entry opens the PDF the staff
  portal builds — the same file a manager gets from Open PDF, with the
  property's own artwork. There is no second rendering of the menu
  anywhere, which is the point: what a guest reads and what the manager
  published are one document.

  Undesigned on purpose. It exists to get out of the way in one tap.

  It reads menus/index.json from Storage, written by the portal when a
  menu is published. That means a menu added later appears here on its
  own — the page carries no list of its own to fall out of date.

  Nobody signs in. Storage rules make menus/ publicly readable and
  nothing else, the same way firestore.rules opens menuItems and nothing
  else, and for the same reason: a QR code on a table has nobody signed
  in behind it.
-->
</head>
<body>

<h1>Leopard Inn</h1>
<p id="status">Loading…</p>
<div id="menus"></div>

<script type="module">
import { firebaseConfig } from "./js/data/firebase-config.js";

// The same SDK version the portal boots with — a different URL is a
// different copy of the SDK with its own service registry.
const SDK = "https://www.gstatic.com/firebasejs/11.0.2";

// The list comes from Firestore, not from Storage.
//
// Storage was the obvious place — the list sat beside the PDFs it
// describes. It does not work: a browser cannot `fetch` a Storage object
// from another origin unless CORS is configured on the bucket, and the
// failure is a bare "Failed to fetch" that says nothing about why. A
// Firestore read has no such trouble.
//
// The PDFs are unaffected, because they are opened by ordinary link
// navigation and CORS does not apply to that.
async function readIndex() {
  const [{ initializeApp }, fs] = await Promise.all([
    import(`${SDK}/firebase-app.js`),
    import(`${SDK}/firebase-firestore.js`),
  ]);
  const db = fs.getFirestore(initializeApp(firebaseConfig()));
  const snap = await fs.getDoc(fs.doc(db, "publicMenus", "index"));
  return snap.exists() ? snap.data() : { menus: [] };
}

function escapeHtml(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function render(menus) {
  // Grouped by property, because a guest at one hotel should not have to
  // read past the other hotel's menus to find theirs.
  const byBranch = {};
  menus.forEach(m => { (byBranch[m.branchLabel || m.branch] ||= []).push(m); });

  return Object.entries(byBranch).map(([label, items]) => `
    <h2>${escapeHtml(label)}</h2>
    <ul>
      ${items.map(m => `<li><a href="${escapeHtml(m.url)}">${escapeHtml(m.title)}</a></li>`).join("")}
    </ul>`).join("");
}

readIndex()
  .then(data => {
    const menus = (data.menus || []).filter(m => m && m.url && m.title);
    if (!menus.length) {
      document.getElementById("status").textContent = "No menus have been published yet.";
      return;
    }
    document.getElementById("status").hidden = true;
    document.getElementById("menus").innerHTML = render(menus);
  })
  .catch(err => {
    // A guest cannot fix this and should not be shown a stack trace. Give
    // them the thing that always works — the phone in reception.
    document.getElementById("status").textContent =
      "Sorry — the menu could not be loaded. Please ask reception.";
    console.error("Menu index failed:", err);
  });
</script>

</body>
</html>
